<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Times+New+Roman&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --cream: #fceea7;
            --black: #000000;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--black);
            font-family: 'Times New Roman', serif;
            user-select: none;
        }

        /* --- UI Components --- */

        /* Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-out;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(212, 175, 55, 0.3);
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .loading-text {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 2px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Title */
        h1 {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 56px;
            margin: 0;
            z-index: 10;
            background: linear-gradient(to bottom, #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Control Panel */
        .control-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 20px 40px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        label {
            color: var(--cream);
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 1px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 200px;
            height: 4px;
            background: rgba(212, 175, 55, 0.3);
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--gold);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--gold);
        }

        button {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 24px;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .upload-container {
            display: flex;
            gap: 10px;
        }

        /* Hint */
        .hint {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: rgba(252, 238, 167, 0.5);
            font-size: 10px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 9;
            transition: opacity 0.5s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <!-- Dependency Management -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <!-- UI Structure -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loading-text">LOADING HOLIDAY MAGIC</div>
    </div>

    <h1 id="ui-title">Merry Christmas</h1>

    <div class="control-panel" id="ui-panel">
        <div class="slider-container">
            <label for="magic-slider">Magic Unfold</label>
            <input type="range" id="magic-slider" min="0" max="1" step="0.01" value="0">
        </div>
        
        <div class="upload-container">
            <button id="focus-btn">Focus Memory</button>
            <button id="upload-btn">ADD MEMORIES</button>
        </div>
        <input type="file" id="file-input" accept="image/*" style="display: none;">
    </div>

    <div class="hint" id="ui-hint">Drag to Rotate | Slide to Unfold</div>

    <!-- Main Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // --- Configuration ---
        const CONFIG = {
            particleCount: 1500,
            dustCount: 2500,
            colors: {
                gold: 0xd4af37,
                cream: 0xfceea7,
                green: 0x2f5a2f,
                red: 0x8a1c1c
            },
            cameraPos: new THREE.Vector3(0, 2, 50),
            focusPos: new THREE.Vector3(0, 2, 35)
        };

        // --- Globals ---
        let camera, scene, renderer, composer, clock;
        let mainGroup, dustSystem;
        let spotGold, spotBlue; // Lights to animate
        let particles = []; // Array of Particle objects
        let isFocusMode = false;
        let focusTarget = null;
        let sliderValue = 0;
        let isDragging = false; // Moved to global for animation loop access

        // UI Elements
        const slider = document.getElementById('magic-slider');
        const loader = document.getElementById('loader');
        const focusBtn = document.getElementById('focus-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const uiElements = [
            document.getElementById('ui-title'),
            document.getElementById('ui-panel'),
            document.getElementById('ui-hint')
        ];

        // --- Particle Class ---
        class Particle {
            constructor(mesh, treePos, scatterPos, type = 'normal') {
                this.mesh = mesh;
                this.treePos = treePos;
                this.scatterPos = scatterPos;
                this.type = type;
                this.phase = Math.random() * Math.PI * 2; // Random starting phase for animation
                
                // Random rotation speed for scatter mode
                this.rotationSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02
                );
            }

            update(lerpFactor, time) {
                // Dynamic Effect: Calculate wave for breathing/twinkling
                const wave = Math.sin(time * 2 + this.phase);

                if (isFocusMode && this.type === 'photo') {
                    if (this === focusTarget) {
                        // Move to front
                        this.mesh.position.lerp(CONFIG.focusPos, 0.05);
                        this.mesh.lookAt(camera.position);
                        // Scale up
                        this.mesh.scale.lerp(new THREE.Vector3(3, 3, 3), 0.05);
                    } else {
                        // Scatter to background
                        this.mesh.position.lerp(this.scatterPos, 0.05);
                        this.mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.05);
                        this.mesh.rotation.x += this.rotationSpeed.x;
                        this.mesh.rotation.y += this.rotationSpeed.y;
                    }
                } else if (isFocusMode) {
                    // Non-photo particles scatter
                    this.mesh.position.lerp(this.scatterPos, 0.05);
                    this.mesh.rotation.x += this.rotationSpeed.x;
                    this.mesh.rotation.y += this.rotationSpeed.y;
                } else {
                    // Normal Slider Logic
                    const target = new THREE.Vector3().lerpVectors(this.scatterPos, this.treePos, lerpFactor);
                    
                    // Dynamic Bobbing (Floating effect)
                    // Add vertical float primarily when formed as a tree
                    const floatY = Math.sin(time + this.phase) * 0.08 * lerpFactor;
                    
                    // Interpolate position
                    this.mesh.position.lerp(new THREE.Vector3(target.x, target.y + floatY, target.z), 0.1);
                    
                    // Dynamic Twinkle (Scale pulsing)
                    // Only apply to deco, keep photos steady unless focused
                    let targetScale = 1;
                    if (this.type !== 'photo') {
                        // Subtle pulse: 0.85 to 1.15
                        targetScale = 1 + 0.15 * wave;
                    }
                    this.mesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);

                    // Rotate if in scatter mode (low lerpFactor), align if tree
                    if (lerpFactor < 0.5) {
                        this.mesh.rotation.x += this.rotationSpeed.x;
                        this.mesh.rotation.y += this.rotationSpeed.y;
                    } else {
                        // Align somewhat to up
                        this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, 0, 0.05);
                        this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, 0, 0.05);
                    }
                }
            }
        }

        init();
        animate();

        function init() {
            // 0. Clock
            clock = new THREE.Clock();

            // 1. Scene Setup
            scene = new THREE.Scene();
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.body.appendChild(renderer.domElement);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(CONFIG.cameraPos);

            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

            // 2. Lights
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const pLight = new THREE.PointLight(0xffaa00, 200, 50);
            pLight.position.set(0, 10, 10);
            scene.add(pLight);

            // Dynamic Spotlights
            spotGold = new THREE.SpotLight(CONFIG.colors.gold, 500);
            spotGold.position.set(20, 20, 20);
            spotGold.angle = 0.5;
            scene.add(spotGold);

            spotBlue = new THREE.SpotLight(0x4444ff, 500);
            spotBlue.position.set(-20, 0, 20);
            spotBlue.angle = 0.5;
            scene.add(spotBlue);

            // 3. Post Processing
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.7;
            bloomPass.strength = 0.45;
            bloomPass.radius = 0.4;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 4. Content Generation
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            createParticles();
            createDust();
            createDefaultMemory();

            // 5. Events
            window.addEventListener('resize', onWindowResize);
            setupInteractions();

            // Remove Loader
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 1000);
            }, 1500);
        }

        function getTreePos(index, total) {
            // Spiral Cone
            const h = (index / total) * 30 - 15; // Height range -15 to 15
            const t = (h + 15) / 30; // 0 to 1
            const maxRadius = 12;
            const radius = maxRadius * (1 - t);
            const angle = index * 0.5; // Spiral tightness
            
            const x = radius * Math.cos(angle);
            const z = radius * Math.sin(angle);
            return new THREE.Vector3(x, h, z);
        }

        function getScatterPos() {
            // Random sphere
            const r = 8 + Math.random() * 12;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            return new THREE.Vector3(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
        }

        function createParticles() {
            const geometries = [
                new THREE.BoxGeometry(0.5, 0.5, 0.5),
                new THREE.SphereGeometry(0.3, 16, 16)
            ];
            
            const materials = [
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.gold, metalness: 0.8, roughness: 0.2 }),
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.green, metalness: 0.3, roughness: 0.6 }),
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.red, metalness: 0.5, roughness: 0.4 })
            ];

            // Candy Cane Geometry
            const path = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -0.5, 0),
                new THREE.Vector3(0, 0.5, 0),
                new THREE.Vector3(0.2, 0.8, 0),
                new THREE.Vector3(0.4, 0.6, 0)
            ]);
            const caneGeo = new THREE.TubeGeometry(path, 20, 0.1, 8, false);
            const caneTex = createCandyTexture();
            const caneMat = new THREE.MeshStandardMaterial({ map: caneTex });

            for (let i = 0; i < CONFIG.particleCount; i++) {
                let mesh;
                if (Math.random() < 0.1) {
                    mesh = new THREE.Mesh(caneGeo, caneMat);
                } else {
                    const geo = geometries[Math.floor(Math.random() * geometries.length)];
                    const mat = materials[Math.floor(Math.random() * materials.length)];
                    mesh = new THREE.Mesh(geo, mat);
                }

                const treePos = getTreePos(i, CONFIG.particleCount);
                const scatterPos = getScatterPos();

                // Initialize at scatter position
                mesh.position.copy(scatterPos);
                mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);

                mainGroup.add(mesh);
                particles.push(new Particle(mesh, treePos, scatterPos, 'deco'));
            }
        }

        function createDust() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < CONFIG.dustCount; i++) {
                const pos = getScatterPos();
                pos.multiplyScalar(1.5); // Wider spread
                vertices.push(pos.x, pos.y, pos.z);
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({ color: CONFIG.colors.cream, size: 0.1, transparent: true, opacity: 0.6 });
            dustSystem = new THREE.Points(geometry, material); // Store in global
            mainGroup.add(dustSystem);
        }

        function createCandyTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,32,32);
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.moveTo(0,0); ctx.lineTo(16,0); ctx.lineTo(32,16); ctx.lineTo(32,32); ctx.lineTo(16,32); ctx.lineTo(0,16);
            ctx.fill();
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createDefaultMemory() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Gold Frame
            ctx.fillStyle = '#d4af37';
            ctx.fillRect(0,0,512,512);
            ctx.fillStyle = '#000';
            ctx.fillRect(20,20,472,472);
            
            // Text
            ctx.font = 'bold 60px "Times New Roman"';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('JOYEUX', 256, 200);
            ctx.fillText('NOEL', 256, 312);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            addPhotoToScene(tex);
        }

        function addPhotoToScene(texture) {
            const geo = new THREE.BoxGeometry(1.5, 1.5, 0.1);
            const mat = new THREE.MeshBasicMaterial({ map: texture });
            const mesh = new THREE.Mesh(geo, mat);

            // Calculate a tree position (random spot on surface)
            const randomH = (Math.random() * 20) - 10;
            const t = (randomH + 15) / 30;
            const r = 12 * (1 - t) + 1; // Slightly offset
            const angle = Math.random() * Math.PI * 2;
            const treePos = new THREE.Vector3(r * Math.cos(angle), randomH, r * Math.sin(angle));
            
            const scatterPos = getScatterPos();
            mesh.position.copy(scatterPos);

            mainGroup.add(mesh);
            particles.push(new Particle(mesh, treePos, scatterPos, 'photo'));
        }

        function setupInteractions() {
            // A. Slider
            slider.addEventListener('input', (e) => {
                sliderValue = parseFloat(e.target.value);
                // If sliding, cancel focus mode
                if(isFocusMode) {
                    isFocusMode = false;
                    focusTarget = null;
                }
            });

            // B. Rotate
            // isDragging is now Global
            let previousMousePosition = { x: 0, y: 0 };

            const onMove = (e) => {
                const x = e.clientX || e.touches[0].clientX;
                const y = e.clientY || e.touches[0].clientY;

                if (isDragging) {
                    const deltaMove = {
                        x: x - previousMousePosition.x,
                        y: y - previousMousePosition.y
                    };
                    
                    mainGroup.rotation.y += deltaMove.x * 0.005;
                    mainGroup.rotation.x += deltaMove.y * 0.002;
                }
                previousMousePosition = { x, y };
            };

            const onStart = (e) => {
                isDragging = true;
                const x = e.clientX || e.touches[0].clientX;
                const y = e.clientY || e.touches[0].clientY;
                previousMousePosition = { x, y };
            };

            const onEnd = () => isDragging = false;

            document.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchstart', onStart);
            document.addEventListener('touchmove', onMove);
            document.addEventListener('touchend', onEnd);

            // C. Focus
            focusBtn.addEventListener('click', () => {
                if (isFocusMode) {
                    isFocusMode = false;
                    focusTarget = null;
                } else {
                    const photos = particles.filter(p => p.type === 'photo');
                    if (photos.length > 0) {
                        focusTarget = photos[Math.floor(Math.random() * photos.length)];
                        isFocusMode = true;
                    }
                }
            });

            // Upload
            uploadBtn.addEventListener('click', () => fileInput.click());
            
            fileInput.addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (!f) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    new THREE.TextureLoader().load(ev.target.result, (t) => {
                        t.colorSpace = THREE.SRGBColorSpace;
                        addPhotoToScene(t);
                    });
                };
                reader.readAsDataURL(f);
            });

            // Hide UI
            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'h') {
                    uiElements.forEach(el => el.classList.toggle('hidden'));
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // 1. Update particles
            particles.forEach(p => p.update(sliderValue, time));

            // 2. Auto Rotation (when not interacting)
            if (!isDragging && !isFocusMode) {
                // Rotate main group slowly
                mainGroup.rotation.y += 0.001;
            }

            // 3. Dust Animation (independent rotation)
            if (dustSystem) {
                dustSystem.rotation.y = time * 0.05; // Independent slow spin
                // Optional: Gentle wave
                dustSystem.position.y = Math.sin(time * 0.5) * 0.5;
            }

            // 4. Lights Animation (Orbiting)
            spotGold.position.x = Math.sin(time * 0.5) * 20;
            spotGold.position.z = Math.cos(time * 0.5) * 20;
            
            spotBlue.position.x = Math.sin(time * 0.5 + Math.PI) * 20; // Opposite side
            spotBlue.position.z = Math.cos(time * 0.5 + Math.PI) * 20;

            composer.render();
        }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
